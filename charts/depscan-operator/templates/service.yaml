{{- if .Values.metricsService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: depscan-operator-metrics
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "depscan-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller-manager
spec:
  type: {{ .Values.metricsService.type }}
  selector:
    {{- include "depscan-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: https-metrics
      port: {{ .Values.metricsService.port }}
      targetPort: metrics
      protocol: TCP
      appProtocol: https
{{- end }}
