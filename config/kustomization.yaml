apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Full operator install: CRDs, namespace, RBAC, and the controller Deployment.
resources:
  - crd/depscan.io_depscanreports.yaml
  - crd/depscan.io_depscanconfigs.yaml
  - manager/namespace.yaml
  - rbac/role.yaml
  - rbac/service_account.yaml
