---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: depscan-operator
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - depscan.io
  resources:
  - depscanconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - depscan.io
  resources:
  - depscanconfigs/status
  - depscanreports/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - depscan.io
  resources:
  - depscanreports
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
