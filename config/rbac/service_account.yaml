apiVersion: v1
kind: ServiceAccount
metadata:
  name: depscan-operator
  namespace: depscan-system
  labels:
    app.kubernetes.io/name: k8s-depscan-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: depscan-operator
  labels:
    app.kubernetes.io/name: k8s-depscan-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: depscan-operator
subjects:
  - kind: ServiceAccount
    name: depscan-operator
    namespace: depscan-system
---
# Leader election and event permissions, scoped to the operator namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: depscan-operator-leader-election
  namespace: depscan-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: depscan-operator-leader-election
  namespace: depscan-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: depscan-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: depscan-operator
    namespace: depscan-system
