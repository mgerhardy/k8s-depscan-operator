---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.3
  name: depscanreports.depscan.io
spec:
  group: depscan.io
  names:
    kind: DepScanReport
    listKind: DepScanReportList
    plural: depscanreports
    shortNames:
    - dsr
    - depscanreport
    singular: depscanreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.summary.criticalCount
      name: Critical
      type: integer
    - jsonPath: .status.summary.highCount
      name: High
      type: integer
    - jsonPath: .status.summary.reachableCount
      name: Reachable
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DepScanReport holds the scan results for one (namespace, image) pair, so
          findings can be queried per namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DepScanReportSpec identifies what was scanned.
            properties:
              image:
                description: Image is the full image reference (repo:tag or repo@sha256:...).
                maxLength: 2048
                pattern: ^[A-Za-z0-9._:/@-]+$
                type: string
              imagePullSecrets:
                description: |-
                  ImagePullSecrets are the names of docker-registry Secrets, in this
                  report's namespace, that hold credentials for the image's registry.
                  They are collected from the workloads using the image so the scan can
                  pull from private registries in a cluster-agnostic way.
                items:
                  type: string
                type: array
              workloads:
                description: Workloads lists the workloads in this namespace that
                  use the image.
                items:
                  description: WorkloadRef references a workload that runs the scanned
                    image.
                  properties:
                    container:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
            required:
            - image
            type: object
          status:
            description: DepScanReportStatus holds the scan outcome.
            properties:
              exported:
                description: Exported indicates whether this report was pushed to
                  DefectDojo.
                type: boolean
              message:
                description: Message carries error or status detail.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                type: string
              scanJob:
                description: ScanJob is the name of the Job that produced this report.
                type: string
              scanner:
                description: Scanner records the dep-scan version/image used.
                type: string
              summary:
                description: Summary aggregates findings by severity.
                properties:
                  criticalCount:
                    type: integer
                  highCount:
                    type: integer
                  lowCount:
                    type: integer
                  mediumCount:
                    type: integer
                  noneCount:
                    type: integer
                  reachableCount:
                    description: ReachableCount is the number of findings dep-scan
                      marked reachable.
                    type: integer
                  unknownCount:
                    type: integer
                required:
                - criticalCount
                - highCount
                - lowCount
                - mediumCount
                - noneCount
                - reachableCount
                - unknownCount
                type: object
              updateTimestamp:
                description: UpdateTimestamp is when the report was last updated.
                format: date-time
                type: string
              vulnerabilities:
                description: Vulnerabilities is the full list of findings.
                items:
                  description: Vulnerability is a single finding reported by dep-scan.
                  properties:
                    fixedVersion:
                      description: FixedVersion is the version that resolves the finding,
                        if known.
                      type: string
                    installedVersion:
                      description: InstalledVersion is the version present in the
                        image.
                      type: string
                    primaryLink:
                      description: PrimaryLink points to the primary advisory.
                      type: string
                    purl:
                      description: PURL is the package URL of the affected component.
                      type: string
                    reachability:
                      description: Reachability is the dep-scan reachability verdict.
                      type: string
                    resource:
                      description: Resource is the affected package name.
                      type: string
                    score:
                      description: |-
                        Score is the CVSS base score as a string, when available (e.g. "9.8").
                        Stored as a string to keep the CRD portable across languages.
                      type: string
                    severity:
                      description: Severity is the normalized severity rating.
                      type: string
                    title:
                      description: Title is a short summary of the vulnerability.
                      type: string
                    vulnerabilityID:
                      description: VulnerabilityID is the CVE/GHSA/advisory identifier.
                      type: string
                  required:
                  - severity
                  - vulnerabilityID
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
